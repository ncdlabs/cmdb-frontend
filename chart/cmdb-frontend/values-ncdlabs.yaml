# Cluster override for ncdLabs cmdb deployment.
# Usage:
#   helm upgrade cmdb-frontend ./chart/cmdb-frontend -n cmdb -f chart/cmdb-frontend/values-ncdlabs.yaml
#
# Prefer this file over bare `--set` so SSH secret + ingress host are not wiped.

# Cluster Service IP (not hostNetwork) so Traefik on other nodes can reach the pod.
# hostNetwork: true only if you need LAN IPv6 NDP and have opened the host port to Traefik nodes.
hostNetwork: false

image:
  pullPolicy: IfNotPresent
  repository: docker.io/library/cmdb
  tag: latest

# Do not hostname-pin. local-path PV already binds data to a node.
nodeSelector: {}

persistence:
  enabled: true
  size: 1Gi
  storageClassName: local-path

ingress:
  host: cmdb.ncdlabs.com
  tls:
    source: certManager
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-cloudflare-production

ssh:
  existingSecret: cmdb-ssh
  identityFile: id_ed25519
