{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled (eq .Values.ingress.tls.source "selfSigned") }}
{{- $secretName := include "cmdb-frontend.tlsSecretName" . }}
{{- $host := .Values.ingress.host }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cmdb-frontend.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  ca.crt: {{ index $existing.data "ca.crt" | default "" }}
{{- else }}
{{- $ca := genCA (printf "%s-ca" (include "cmdb-frontend.fullname" .)) 3650 }}
{{- $cert := genSignedCert $host nil (list $host) 825 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cmdb-frontend.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
